<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartBazar 360</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#222}
header{background:#087b48;color:white;padding:22px 14px;text-align:center}
header h1{margin:0;font-size:28px}
header p{margin:8px 0 0}
.search{padding:15px}
input{width:100%;padding:13px;border:1px solid #ccc;border-radius:8px;font-size:16px}
h2{padding:0 15px;color:#087b48}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.product{background:white;border-radius:10px;padding:12px;text-align:center;box-shadow:0 2px 7px #ddd}
.product .pic{font-size:48px;background:#eef8f1;padding:18px;border-radius:8px}
.product h3{font-size:16px}
.price{color:#087b48;font-weight:bold}
button{border:0;border-radius:7px;padding:11px;background:#087b48;color:white;font-size:15px;cursor:pointer}
.cart{background:white;margin:15px;padding:15px;border-radius:10px}
.cart p{border-bottom:1px solid #eee;padding:8px 0}
.order{width:100%;background:#079b52;font-weight:bold}
footer{text-align:center;padding:20px;color:#666}
</style>
</head>
<body>
<header>
<h1>🛍️ SMARTBAZAR 360</h1>
<p>আপনার পছন্দ, আমাদের বাজার</p>
<p>সারা বাংলাদেশে অনলাইন শপিং</p>
</header>
<div class="search">
<input id="search" placeholder="পণ্য খুঁজুন..." oninput="showProducts()">
</div>
<h2>আমাদের পণ্য</h2>
<div class="products" id="products"></div>
<div class="cart">
<h2>🛒 আপনার কার্ট</h2>
<div id="cart"></div>
<h3 id="total">মোট: ৳০</h3>
<button class="order" onclick="orderNow()">WhatsApp-এ অর্ডার করুন</button>
<p>পেমেন্ট: ক্যাশ অন ডেলিভারি (COD)</p>
</div>
<footer>© 2026 SmartBazar 360</footer>
<script>
const items=[
{name:"টি-শার্ট",price:450,emoji:"👕"},
{name:"স্মার্ট ঘড়ি",price:1200,emoji:"⌚"},
{name:"হেডফোন",price:850,emoji:"🎧"},
{name:"ব্যাকপ্যাক",price:950,emoji:"🎒"},
{name:"জুতা",price:1400,emoji:"👟"},
{name:"সানগ্লাস",price:550,emoji:"🕶️"},
{name:"মোবাইল কভার",price:250,emoji:"📱"},
{name:"পানির বোতল",price:300,emoji:"🧴"}
];
let basket=[];
function showProducts(){
let q=document.getElementById("search").value.toLowerCase();
document.getElementById("products").innerHTML=items.filter(x=>x.name.toLowerCase().includes(q)).map((x,i)=>'<div class="product"><div class="pic">'+x.emoji+'</div><h3>'+x.name+'</h3><p class="price">৳'+x.price+'</p><button onclick="addItem('+items.indexOf(x)+')">কার্টে যোগ করুন</button></div>').join("");
}
function addItem(i){basket.push(items[i]);showCart()}
function showCart(){
document.getElementById("cart").innerHTML=basket.length?basket.map((x,i)=>'<p>'+x.name+' — ৳'+x.price+' <button onclick="removeItem('+i+')">বাদ দিন</button></p>').join(""):"কার্ট খালি";
document.getElementById("total").innerText="মোট: ৳"+basket.reduce((s,x)=>s+x.price,0);
}
function removeItem(i){basket.splice(i,1);showCart()}
function orderNow(){
if(!basket.length){alert("আগে পণ্য কার্টে যোগ করুন");return}
let msg="নতুন অর্ডার - SmartBazar 360%0A"+basket.map(x=>x.name+" ৳"+x.price).join("%0A")+"%0Aমোট: ৳"+basket.reduce((s,x)=>s+x.price,0);
window.open("https://wa.me/8801728002430?text="+msg,"_blank");
}
showProducts();showCart();
</script>
</body>
</html>
